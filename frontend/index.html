<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heavy Rainfall Predictor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>🌧️ Heavy Rainfall Predictor</h1>
  <nav>
    <a href="index.html" class="active">Predict</a>
    <a href="insights.html">Insights</a>
    <a href="live.html">Live Forecast</a>
  </nav>
  <button id="themeToggle">🌙 Dark</button>
</header>
<main>
  <div class="grid">
    <div class="card">
      <h2>Weather Input</h2>
      <div class="row2">
        <div><label>Relative humidity (%)</label><input id="relative_humidity" type="number" step="any"></div>
        <div><label>Cloud cover (%)</label><input id="cloud_cover" type="number" step="any"></div>
        <div><label>Dew point (°C)</label><input id="dew_point" type="number" step="any"></div>
        <div><label>Surface pressure (hPa)</label><input id="surface_pressure" type="number" step="any"></div>
        <div><label>Temp mean (°C)</label><input id="temp_mean" type="number" step="any"></div>
        <div><label>Temp max (°C)</label><input id="temp_max" type="number" step="any"></div>
        <div><label>Temp min (°C)</label><input id="temp_min" type="number" step="any"></div>
        <div><label>Wind speed mean (km/h)</label><input id="wind_speed_mean" type="number" step="any"></div>
        <div><label>Wind speed max (km/h)</label><input id="wind_speed_max" type="number" step="any"></div>
        <div><label>Wind gust (km/h)</label><input id="wind_gust" type="number" step="any"></div>
        <div><label>Wind direction (°)</label><input id="wind_direction" type="number" step="any"></div>
        <div><label>Yesterday's rain (mm)</label><input id="rain_lag1" type="number" step="any"></div>
      </div>
      <label>Day of year</label><input id="day_of_year" type="number">
      <button onclick="predict()">Get Prediction</button>
      <div class="samples">
        <button class="ghost" onclick="loadCase('heavy_rain_day')">Heavy rain case</button>
        <button class="ghost" onclick="loadCase('normal_day')">Normal day</button>
        <button class="ghost" onclick="loadCase('unusual_oceanic_input')">Unusual input</button>
      </div>
      <div id="status"></div>
    </div>

    <div class="card">
      <h2>Prediction</h2>
      <div class="risk" id="risk">—</div>
      <div class="prob" id="prob">–<small>%</small></div>
      <div class="bar"><div id="probBar" style="width:0%"></div></div>
      <div id="predLabel" style="text-align:center;font-size:14px;color:var(--mut);margin-bottom:12px"></div>
      <div style="margin-top:14px"><span class="rel" id="rel">RELIABILITY —</span></div>
      <ul class="why" id="relReasons"></ul>
      <div class="note" id="disc"></div>
    </div>

    <div class="card">
      <h2>Why this prediction? (SHAP)</h2>
      <div id="shapChart"><div class="note">Run a prediction to see feature contributions.</div></div>
      <div class="note" id="shapNote"></div>
    </div>
  </div>
</main>
<footer>Prototype · Public IMD + ERA5 data · XAI-driven · Not an operational ISRO forecasting system</footer>
<script src="app.js"></script>
<script>
async function loadCase(name){
  const samples = await (await fetch("/frontend/samples.json")).json();
  const c = samples.cases[name];
  FEATURES.forEach(f => { document.getElementById(f).value = c[f]; });
  predict();
}

async function predict(){
  const payload = {};
  const missing = [];
  FEATURES.forEach(f => {
    const v = document.getElementById(f).value;
    if (v === "" ) missing.push(f); else payload[f] = parseFloat(v);
  });
  if (missing.length){ document.getElementById("status").innerHTML = '<span class="err">Missing: ' + missing.join(", ") + '</span>'; return; }
  document.getElementById("status").textContent = "Predicting…";
  try {
    const r = await fetch("/predict", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(payload) });
    if (!r.ok){ const e = await r.json(); throw new Error(e.detail || r.status); }
    const d = await r.json();
    document.getElementById("predLabel").textContent = "Prediction: " + d.prediction + "  ·  (threshold >" + d.heavy_rain_threshold_mm + " mm/day)";
    applyResult(d);
  } catch(e){
    if (!IS_LOCAL){
      applyDemoCase();
      document.getElementById("status").textContent = "Hosted demo mode: showing precomputed runs of the trained model. Run the API locally for live inference.";
      return;
    }
    document.getElementById("status").innerHTML = '<span class="err">Error: ' + esc(e.message) + '</span>';
  }
}
</script>
</body>
</html>
